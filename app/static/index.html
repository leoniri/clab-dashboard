<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Labs · Containerlab</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script>try{if(localStorage.getItem("clabd-theme")==="light")document.documentElement.setAttribute("data-theme","light")}catch(e){}</script>
<link rel="stylesheet" href="ui.css">
<style>
/* ---------- header ---------- */
.live{display:inline-flex;align-items:center;gap:7px;font:500 11.5px var(--font-mono);color:var(--muted);
  padding:4px 10px;border:1px solid var(--line);border-radius:99px;background:var(--surface)}
.live.stale{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}

/* ---------- host instruments ----------
   One panel, four cells split by hairlines. Each cell: label row, a ring
   gauge beside the headline number, and a full-width footer strip (trend line,
   capacity bar or running labs) so all four line up. */
.host{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 28px}
.inst{position:relative;min-width:0;padding:16px 20px 0;display:flex;flex-direction:column;overflow:hidden;isolation:isolate;
  border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) 70%,var(--surface)) 0%,var(--surface) 100%);
  transition:border-color .2s}
.inst:hover{border-color:var(--line-strong)}
.inst::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ring,var(--accent)) 60%,transparent),transparent)}
.inst::after{content:"";position:absolute;inset:-60% 30% auto -30%;height:140%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--ring,var(--accent)) 8%,transparent),transparent)}
.inst .k{display:flex;align-items:center;gap:8px;font:500 12px var(--font-sans);color:var(--ink-2);letter-spacing:.01em}
.inst .k .ic{display:grid;place-items:center;width:22px;height:22px;border-radius:7px;
  background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.inst .k .ic svg{width:13px;height:13px}
.inst .k .chip{margin-left:auto;font:500 10.5px var(--font-mono);padding:2px 8px;border-radius:99px;
  color:var(--muted);background:var(--surface-3);white-space:nowrap}
.inst .k .chip.ok{color:var(--ok);background:var(--ok-soft)}
.inst .k .chip.warn{color:var(--warn);background:var(--warn-soft)}
.inst .k .chip.crit{color:var(--crit);background:var(--crit-soft)}
.inst .body{display:flex;align-items:center;gap:16px;margin-top:14px}
.ring{flex:none;position:relative;width:58px;height:58px}
.ring svg{width:58px;height:58px;transform:rotate(-90deg);overflow:visible}
.ring .track{fill:none;stroke:var(--surface-3);stroke-width:5}
.ring .arc{fill:none;stroke:var(--ring,var(--accent));stroke-width:5;stroke-linecap:round;
  transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1),stroke .4s;
  filter:drop-shadow(0 0 5px color-mix(in srgb,var(--ring,var(--accent)) 45%,transparent))}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:600 13px var(--font-mono);
  font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:-.02em}
.ring b small{font-size:9px;color:var(--muted);margin-left:1px;font-weight:500}
.inst.warn{--ring:var(--warn)} .inst.crit{--ring:var(--crit)} .inst.okc{--ring:var(--ok)}
.inst .num{min-width:0}
.inst .v{font:600 26px/1.05 var(--font-display);letter-spacing:-.025em;font-variant-numeric:tabular-nums;
  white-space:nowrap;color:var(--ink)}
.inst .v small{font:500 13px var(--font-sans);color:var(--muted);margin-left:5px;letter-spacing:0}
.inst .d{font:400 11.5px var(--font-mono);color:var(--muted);margin-top:6px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.inst .d em{font-style:normal;color:var(--ink-2)}
.inst .foot{margin:14px -20px 0;height:44px;position:relative}
/* trend line, edge to edge, fading out at the top */
.inst .trend{position:absolute;inset:0;width:100%;height:100%;display:block}
.inst .trend .l{fill:none;stroke:var(--ring,var(--accent));stroke-width:1.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.inst .trend .dot{fill:var(--ring,var(--accent))}
.inst .foot .span{position:absolute;right:12px;top:2px;font:500 9.5px var(--font-mono);color:var(--muted);
  letter-spacing:.06em;text-transform:uppercase;opacity:.8}
/* disk capacity */
.cap{position:absolute;left:20px;right:20px;top:8px}
.cap .track{height:8px;border-radius:99px;background:var(--surface-3);overflow:hidden;
  box-shadow:inset 0 1px 1px rgba(0,0,0,.18)}
.cap .used{height:100%;border-radius:99px;transition:width .9s cubic-bezier(.2,.7,.2,1);
  background:linear-gradient(90deg,color-mix(in srgb,var(--ring,var(--accent)) 70%,transparent),var(--ring,var(--accent)));
  box-shadow:0 0 10px color-mix(in srgb,var(--ring,var(--accent)) 40%,transparent)}
.cap .legend{display:flex;justify-content:space-between;margin-top:8px;font:500 10.5px var(--font-mono);color:var(--muted)}
.cap .legend i{display:inline-block;width:7px;height:7px;border-radius:2px;margin-right:6px;vertical-align:0;background:var(--ring,var(--accent))}
.cap .legend span + span i{background:var(--surface-3);box-shadow:inset 0 0 0 1px var(--line-strong)}
/* running labs */
.runl{position:absolute;left:20px;right:20px;top:6px;display:flex;gap:6px;flex-wrap:nowrap;overflow:hidden}
.runl a{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 9px;border-radius:99px;
  font:500 11px var(--font-mono);color:var(--ink-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--ok-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ok) 25%,transparent)}
.runl a:hover{color:var(--ink)}
.runl a i{flex:none;width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok)}
.runl .more{color:var(--muted);background:var(--surface-3);box-shadow:none}
.runl .none{font:400 11px var(--font-mono);color:var(--muted);padding-top:3px}
@media (max-width:1100px){ .host{grid-template-columns:1fr 1fr} }
@media (max-width:560px){ .host{grid-template-columns:1fr} }

/* ---------- toolbar ---------- */
.listhead{display:flex;align-items:flex-end;gap:14px;margin:0 0 14px;flex-wrap:wrap}
.lh-title{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.lh-title h2{margin:0;font:600 20px var(--font-display);letter-spacing:-.02em;color:var(--ink)}
.listhead .count{display:flex;gap:6px;flex-wrap:wrap}
.listhead .count span{display:inline-flex;align-items:center;gap:6px;font:500 11px var(--font-mono);color:var(--muted);
  padding:3px 9px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.listhead .count b{color:var(--ink);font-weight:600}
.listhead .count i{width:6px;height:6px;border-radius:50%;background:var(--idle)}
.listhead .count .on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.listhead .tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.listhead .useg button .n{margin-left:6px;font:600 10px var(--font-mono);color:var(--muted);
  padding:0 5px;border-radius:99px;background:var(--surface-3)}
.listhead .useg button[aria-pressed=true] .n{color:var(--accent-ink);background:var(--accent-soft)}
.search input{width:260px}
@media (max-width:760px){ .search input{width:170px} }

/* ---------- lab cards ----------
   thumb | name, kinds + notes, path | facts (fixed) | actions (fixed), so the
   numbers and buttons line up from one card to the next. */
.labs{display:flex;flex-direction:column;gap:10px}
.lab{position:relative;display:grid;grid-template-columns:128px minmax(0,1fr) 216px 340px;align-items:center;gap:20px;
  padding:12px 14px 12px 12px;border:1px solid var(--line);border-radius:14px;isolation:isolate;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 0%,var(--surface) 100%);
  box-shadow:var(--shadow-sm);cursor:pointer;
  transition:border-color .18s,box-shadow .18s,transform .18s;animation:rise .25s ease-out both}
.lab:hover{border-color:var(--line-strong);box-shadow:var(--shadow);transform:translateY(-1px)}
.lab:focus-visible{outline:none;box-shadow:var(--glow)}
.lab::after{content:"";position:absolute;inset:0 0 auto 0;height:1px;border-radius:14px 14px 0 0;pointer-events:none;
  background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--line-strong) 80%,transparent),transparent)}
.lab.run{border-color:color-mix(in srgb,var(--ok) 32%,var(--line))}
.lab.run::after{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--ok) 65%,transparent),transparent)}
.lab.run::before{content:"";position:absolute;left:-1px;top:16px;bottom:16px;width:3px;border-radius:0 3px 3px 0;
  background:var(--ok);box-shadow:0 0 12px var(--ok)}
.lab.part{border-color:color-mix(in srgb,var(--warn) 32%,var(--line))}
.lab.part::before{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.lab.part::after{background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--warn) 65%,transparent),transparent)}
.lab.open{border-bottom-left-radius:0;border-bottom-right-radius:0;border-color:var(--line-strong);transform:none}

/* thumbnail: a little dotted canvas with the lab drawn on it */
.thumb{width:128px;height:76px;border-radius:10px;display:block;overflow:hidden;border:1px solid var(--line);
  background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 70%),
    radial-gradient(var(--grid) 1px,transparent 1.2px) 0 0/8px 8px,var(--canvas)}
.thumb line{stroke:var(--line-strong);stroke-width:1.2;stroke-linecap:round}
.thumb circle{fill:var(--oth);stroke:var(--canvas);stroke-width:1.6}
.thumb .k-xe{fill:var(--xe)} .thumb .k-xr{fill:var(--xr)} .thumb .k-nx{fill:var(--nx)} .thumb .k-lin{fill:var(--lin)}
.thumb .k-frr{fill:var(--frr)} .thumb .k-srl{fill:var(--srl)}
.lab:not(.run) .thumb circle{opacity:.75}
.lab.run .thumb{border-color:color-mix(in srgb,var(--ok) 25%,var(--line))}
.lab.run .thumb line{stroke:color-mix(in srgb,var(--ok) 60%,var(--line-strong));stroke-dasharray:3 3;animation:flow 1.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-6}}
@media (prefers-reduced-motion:reduce){ .lab.run .thumb line{animation:none} .lab{animation:none} }

.labmain{min-width:0;display:flex;flex-direction:column;gap:7px}
.labname{display:flex;align-items:center;gap:10px;min-width:0}
.labname a{font:600 17px var(--font-display);color:var(--ink);text-decoration:none;letter-spacing:-.015em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.labname a:hover{color:var(--accent-ink)}
.state{flex:none;display:inline-flex;align-items:center;gap:6px;font:500 10.5px var(--font-mono);letter-spacing:.04em;
  padding:2px 9px 2px 8px;border-radius:99px;color:var(--muted);background:var(--idle-soft)}
.state i{width:6px;height:6px;border-radius:50%;background:currentColor}
.state.ok{color:var(--ok);background:var(--ok-soft)} .state.ok i{box-shadow:0 0 6px var(--ok);animation:pulse 2s ease-in-out infinite}
.state.warn{color:var(--warn);background:var(--warn-soft)}
.state.info{color:var(--accent-ink);background:var(--accent-soft)} .state.info i{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.labmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.labmeta .sep{width:1px;height:14px;background:var(--line-strong);margin:0 2px}
.kinds{display:contents}
.labsub{display:flex;align-items:center;gap:6px;font:11px var(--font-mono);color:var(--muted);min-width:0}
.labsub svg{flex:none;width:12px;height:12px;opacity:.7}
.labsub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.facts{display:grid;grid-template-columns:repeat(3,1fr);align-self:stretch;align-items:center;
  border-left:1px solid var(--line);border-right:1px solid var(--line);font-variant-numeric:tabular-nums}
.facts div{text-align:center;padding:0 4px}
.facts div + div{border-left:1px dashed color-mix(in srgb,var(--line) 70%,transparent)}
.facts b{display:block;font:600 18px/1.1 var(--font-display);color:var(--ink);letter-spacing:-.02em;white-space:nowrap}
.facts b small{font:500 11px var(--font-sans);color:var(--muted);margin-left:2px;letter-spacing:0}
.facts b em{font-style:normal;color:var(--muted);font-weight:500}
.facts span{display:block;margin-top:4px;font:500 9.5px var(--font-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.acts .ub.main{min-width:112px}
.acts .ub.main.go svg{color:var(--ok)} .acts .ub.main.re svg{color:var(--warn)} .acts .ub.main.halt svg{color:var(--crit)}
.acts .chev svg{transition:transform .18s}
.lab.open .acts .chev svg{transform:rotate(180deg)}
@media (max-width:1240px){ .lab{grid-template-columns:128px minmax(0,1fr) 190px auto} }
@media (max-width:1060px){ .lab{grid-template-columns:128px minmax(0,1fr) auto} .facts{display:none} }
@media (max-width:760px){
  .lab{grid-template-columns:minmax(0,1fr) auto} .thumb{display:none}
  .acts .ub.main{min-width:0}
}

/* node table */
.nodes{margin-top:-11px;border:1px solid var(--line-strong);border-top:1px dashed var(--line);
  border-radius:0 0 14px 14px;background:var(--surface);box-shadow:var(--shadow);overflow-x:auto;padding:6px 10px 10px;
  animation:rise .2s ease-out both}
.nodes table{min-width:760px}
.nodes td{font:12px var(--font-mono);white-space:nowrap;padding:7px 12px}
.nodes td.nm{font-weight:600;color:var(--ink)}
.nodes td.nm .tag{margin-left:6px}
.nodes .ok{color:var(--ok)}

/* ---------- empty / first run ---------- */
.first{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:6px}
.first a{display:flex;flex-direction:column;gap:6px;padding:20px;border-radius:var(--r-lg);background:var(--surface);
  border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:border-color .15s,box-shadow .15s}
.first a:hover{border-color:var(--accent);box-shadow:var(--glow)}
.first svg{width:26px;height:26px;color:var(--accent)}
.first b{font:600 15px var(--font-display)}
.first span{font-size:12.5px;color:var(--muted)}
@media (max-width:760px){ .first{grid-template-columns:1fr} }

/* ---------- confirm modal (delete needs a typed name) ---------- */
.plan{font:11.5px var(--font-mono);margin:6px 0 12px;padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);list-style:none;word-break:break-all;color:var(--ink)}
.plan li+li{margin-top:4px}
#mextra label{display:block;font-size:12.5px;color:var(--ink-2);margin:0 0 6px}
#mextra .note{margin-bottom:12px}
</style>
</head>
<body class="dots">

<header id="appbar"></header>

<main class="page">
  <div class="page-h">
    <div>
      <div class="eyebrow">lab control</div>
      <h1>Labs</h1>
      <div class="sub" id="hostline">connecting…</div>
    </div>
    <div class="tools" id="headtools"></div>
  </div>

  <section class="host" id="stats" aria-label="Host status"></section>

  <div class="listhead">
    <div class="lh-title"><h2>Topologies</h2><span class="count" id="labcount"></span></div>
    <div class="tools">
      <label class="search"><span id="searchicon"></span><input class="uin" id="q" type="search" data-search placeholder="Filter by name, kind or path" aria-label="Filter labs by name, kind or path"><span class="kbd">/</span></label>
      <span id="filterseg"></span>
    </div>
  </div>

  <div class="labs" id="labs"><div class="empty plain"><span class="spin"></span>&nbsp; loading labs…</div></div>
</main>

<div class="console" id="console" hidden>
  <div class="chead">
    <span class="spin" id="cspin"></span>
    <strong id="ctitle">—</strong>
    <span class="cmd" id="ccmd"></span>
    <span class="right">
      <button id="cfollow" aria-pressed="true">follow</button>
      <button id="cclose">close</button>
    </span>
  </div>
  <div class="clog" id="clog"></div>
</div>

<div class="termwrap" id="termwrap" hidden>
  <div class="termbox">
    <div class="termhead">
      <span class="who" id="term_who">—</span>
      <span class="meta" id="term_meta"></span>
      <span class="right">
        <a id="term_tab" href="#" target="_blank" rel="noopener">new tab</a>
        <button id="term_reload">reconnect</button>
        <button id="term_close">close</button>
      </span>
    </div>
    <iframe id="term_frame" title="Router CLI" allow="clipboard-write"></iframe>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="dlg" id="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
    <header><div class="dlg-ic danger" id="micon"></div><h3 id="mtitle">Confirm</h3></header>
    <div class="body">
      <p id="mbody"></p>
      <div id="mextra"></div>
    </div>
    <footer>
      <button class="ub quiet" id="mcancel">Cancel</button>
      <button class="ub danger" id="mok">Confirm</button>
    </footer>
  </div>
</div>

<script src="ui.js"></script>
<script src="lan-dialog.js"></script>
<script>
(function(){
"use strict";

var POLL_IDLE = 3000, POLL_BUSY = 1000;
var state = null, expanded = new Set(), filter = "all";
var job = null, jobLines = 0, follow = true, timer = null, failures = 0;
var memHist = [], cpuHist = [], histT = [];

// ---------- helpers ----------
function $(id){ return document.getElementById(id); }
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt !== undefined && txt !== null) e.textContent = txt;
  return e;
}
function svgEl(t, a){ var e = document.createElementNS("http://www.w3.org/2000/svg", t); for (var k in a) e.setAttribute(k, a[k]); return e; }
function gb(mb){
  if (mb === null || mb === undefined) return "—";
  return mb >= 1024 ? (mb/1024).toFixed(mb >= 10240 ? 0 : 1) + " GB" : mb + " MB";
}
function dur(s){
  if (!s && s !== 0) return "—";
  var d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if (d) return d + "d " + h + "h";
  if (h) return h + "h " + m + "m";
  return m + "m";
}
function sevClass(pct){ return pct >= 90 ? "crit" : pct >= 75 ? "warn" : ""; }

// ---------- app bar ----------
var liveBox = el("span","live");
var liveDot = el("span","led ok pulse"); liveDot.id = "livedot"; liveBox.appendChild(liveDot);
var liveTxt = el("span",null,"live"); liveTxt.id = "livetxt"; liveBox.appendChild(liveTxt);
UI.appbar($("appbar"), {active:"labs"});   // liveBox is kept off-screen: the poller still updates it
$("searchicon").appendChild(UI.icon("search"));

function newLabMenu(anchor){
  UI.menu(anchor, [
    {label:"Draw it in the builder", icon:"builder", href:"/builder.html"},
    {label:"From a template", icon:"grid", href:"/catalog.html", hint:"catalogue"},
    {label:"Import a zip or git repo", icon:"upload", href:"/catalog.html#import"}
  ]);
}
var newBtn = UI.button("New lab", "primary", null, "plus");
newBtn.setAttribute("aria-haspopup","menu");
newBtn.addEventListener("click", function(){ newLabMenu(newBtn); });
$("headtools").appendChild(newBtn);

UI.commands([
  {label:"New lab - draw it in the builder", icon:"builder", run:function(){ location.href = "/builder.html"; }},
  {label:"New lab - from a template", icon:"grid", run:function(){ location.href = "/catalog.html"; }},
  {label:"Show running labs", icon:"play", run:function(){ setFilter("running"); }},
  {label:"Show all labs", icon:"labs", run:function(){ setFilter("all"); }},
  {label:"Collapse every node table", icon:"list", run:function(){ expanded.clear(); if (state) redraw(); }}
]);
UI.keys([{keys:"Enter", label:"on a focused lab row: show / hide its nodes"}]);

// ---------- host stats ----------
// Built once, then updated in place so the gauges and bars animate.
var RING_C = 2 * Math.PI * 25;
var inst = null;
function instCell(ic, label){
  var c = el("div","inst"), k = el("div","k"), i = el("span","ic");
  i.appendChild(UI.icon(ic)); k.appendChild(i); k.appendChild(el("span", null, label));
  var chip = el("span","chip"); k.appendChild(chip); c.appendChild(k);
  var body = el("div","body"), ring = el("div","ring");
  var sv = svgEl("svg", {viewBox:"0 0 58 58"});
  sv.appendChild(svgEl("circle", {"class":"track", cx:29, cy:29, r:25}));
  var arc = svgEl("circle", {"class":"arc", cx:29, cy:29, r:25, "stroke-dasharray":RING_C, "stroke-dashoffset":RING_C});
  sv.appendChild(arc); ring.appendChild(sv);
  var rl = el("b"); ring.appendChild(rl); body.appendChild(ring);
  var num = el("div","num"), v = el("div","v"), d = el("div","d");
  num.appendChild(v); num.appendChild(d); body.appendChild(num); c.appendChild(body);
  var foot = el("div","foot"); c.appendChild(foot);
  $("stats").appendChild(c);
  return {c:c, chip:chip, arc:arc, rl:rl, v:v, d:d, foot:foot};
}
function setRing(x, frac, label, unit){
  x.arc.setAttribute("stroke-dashoffset", (RING_C * (1 - Math.max(0, Math.min(1, frac)))).toFixed(2));
  x.rl.textContent = label; if (unit) x.rl.appendChild(el("small", null, unit));
}

// smooth trend line (Catmull-Rom as cubic Béziers) with a gradient fill fading upwards
var gradSeq = 0;
function trend(x, hist){
  var w = 300, h = 44, n = hist.length;
  if (!x.tr){
    var id = "tg" + (++gradSeq);
    var s = svgEl("svg", {"class":"trend", viewBox:"0 0 " + w + " " + h, preserveAspectRatio:"none"});
    var defs = svgEl("defs"), g = svgEl("linearGradient", {id:id, x1:0, y1:0, x2:0, y2:1});
    var s1 = svgEl("stop", {offset:"0"}); s1.setAttribute("style", "stop-color:var(--ring,var(--accent));stop-opacity:.28");
    var s2 = svgEl("stop", {offset:"1"}); s2.setAttribute("style", "stop-color:var(--ring,var(--accent));stop-opacity:0");
    g.appendChild(s1); g.appendChild(s2); defs.appendChild(g); s.appendChild(defs);
    var a = svgEl("path", {fill:"url(#" + id + ")"}), l = svgEl("path", {"class":"l"});
    s.appendChild(a); s.appendChild(l);
    x.foot.appendChild(s);
    var sp = el("span","span"); x.foot.appendChild(sp);
    x.tr = {a:a, l:l, sp:sp};
  }
  x.tr.sp.textContent = n > 1 ? "last " + dur(Math.max(60, Math.round((Date.now() - histT[0]) / 1000))) : "";
  if (n < 2){ x.tr.a.setAttribute("d", ""); x.tr.l.setAttribute("d", ""); return; }
  // the line's own range (at least 10 points), so a steady value sits mid-strip
  var hi = Math.max.apply(null, hist), lo = Math.min.apply(null, hist);
  var mid = (hi + lo) / 2, half = Math.max(5, (hi - lo) / 2 * 1.3);
  lo = Math.max(0, mid - half); hi = lo + 2 * half;
  var pts = hist.map(function(v, i){ return [(i / (n - 1)) * w, h - 4 - ((v - lo) / (hi - lo)) * (h - 14)]; });
  var d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
  for (var i = 0; i < n - 1; i++){
    var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += "C" + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + " " + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)
       + " " + (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + " " + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)
       + " " + p2[0].toFixed(1) + " " + p2[1].toFixed(1);
  }
  x.tr.l.setAttribute("d", d);
  x.tr.a.setAttribute("d", d + "L" + w + " " + h + "L0 " + h + "Z");
}

// A tiny drawing of the lab: builder positions when the topology has them,
// otherwise the nodes on a circle. Purely decorative - the map is one click away.
function thumb(l){
  var W = 128, H = 76, s = svgEl("svg", {"class":"thumb", viewBox:"0 0 " + W + " " + H, "aria-hidden":"true"});
  var nodes = l.nodes || [], n = nodes.length;
  if (!n) return s;
  var pos = {}, have = nodes.filter(function(x){ return x.pos && x.pos.length === 2; }).length === n;
  if (have){
    var xs = nodes.map(function(x){ return +x.pos[0]; }), ys = nodes.map(function(x){ return +x.pos[1]; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
    var sx = (W - 20) / Math.max(1, x1 - x0), sy = (H - 16) / Math.max(1, y1 - y0), sc = Math.min(sx, sy);
    var ox = (W - (x1 - x0) * sc) / 2, oy = (H - (y1 - y0) * sc) / 2;
    nodes.forEach(function(x){ pos[x.name] = [ox + (x.pos[0] - x0) * sc, oy + (x.pos[1] - y0) * sc]; });
  } else {
    var rx = n === 1 ? 0 : W / 2 - 12, ry = n === 1 ? 0 : H / 2 - 9;
    nodes.forEach(function(x, i){
      var a = -Math.PI / 2 + i * 2 * Math.PI / n;
      pos[x.name] = [W / 2 + rx * Math.cos(a), H / 2 + ry * Math.sin(a)];
    });
  }
  (l.links || []).forEach(function(k){
    var a = pos[k.a], b = pos[k.b];
    if (a && b) s.appendChild(svgEl("line", {x1:a[0], y1:a[1], x2:b[0], y2:b[1]}));
  });

    var p = pos[x.name];
    s.appendChild(svgEl("circle", {cx:p[0], cy:p[1], r:r, "class":UI.kindClass(x.kind, x.image)}));
  });
  return s;
}

        if (c.state){
          stTd.appendChild(el("span","pill " + (c.state === "running" ? "ok" : "crit"), c.state));
        } else { stTd.className = "dim"; stTd.textContent = "—"; }
        tr.appendChild(stTd);
        var hTd = el("td");
        if (/^(healthy|starting|unhealthy)$/.test(c.status || "")){
          var hc = c.status === "healthy" ? "ok" : c.status === "starting" ? "warn" : "crit";
          hTd.appendChild(el("span","pill " + hc, c.status));
        } else { hTd.className = "dim"; hTd.textContent = "—"; hTd.title = "no health check"; }
        tr.appendChild(hTd);
        tr.appendChild(el("td", c.ipv4 ? null : "dim", c.ipv4 || n.mgmt_ipv4 || "—"));
        var lanIp = l.lan && l.lan.nodes[n.name], lanUp = l.lan && l.lan.active.indexOf(n.name) >= 0;
        var lanTd = el("td", lanUp ? "ok" : "dim", lanIp ? lanIp + (lanUp ? "" : " (off)") : "—");
        var sshm = lanUp && l.lan.ssh ? l.lan.ssh[n.name] : null;
        if (sshm === "gateway"){
          lanTd.title = "no SSH server on this node - ssh reaches the dashboard's SSH gateway: "
            + l.lan.gateway_login + ", lands in the node's CLI";
          lanTd.appendChild(el("span", "dim", " · ssh gw"));
        } else if (lanUp && (l.lan.unreachable || []).indexOf(n.name) >= 0){
          lanTd.title = "the LAN address is live, but the node's management address does not answer";
          lanTd.appendChild(el("span", "dim", " · unreachable"));
          lanTd.style.color = "var(--warn)";
        } else if (sshm === "none"){
          lanTd.title = "the address is live, but nothing answers on port 22 yet";
          lanTd.appendChild(el("span", "dim", " · no ssh yet"));
        }
        tr.appendChild(lanTd);
        tr.appendChild(el("td", c.cpu ? null : "dim", c.cpu || "—"));
        tr.appendChild(el("td", c.mem ? null : "dim", c.mem || gb(n.est_ram_mb) + " est"));
        var cliTd = el("td"); cliTd.style.textAlign = "right";
        if (c.name && c.state === "running"){
          var cli = UI.button("CLI", "sm", function(){
            openTerm(c.name, n.name + " · " + l.name, (c.ipv4 || "") + " · " + n.kind);
          }, "terminal");
          cli.title = "open " + c.name + " in the browser";
          cliTd.appendChild(cli);
        }
        tr.appendChild(cliTd);
        tb.appendChild(tr);
      });
      t.appendChild(tb); wrap.appendChild(t); box.appendChild(wrap);
    }
  });
}

// ---------- web terminal ----------
// ttyd sits behind /term/ and takes the container name in ?arg=. The server
// validates that name against the running containers before it execs ssh, and
// resolves the credentials from the topology, so nothing sensitive is in here.
function termUrl(container){
  return "term/?arg=" + encodeURIComponent(container);
}
function openTerm(container, who, meta){
  $("term_who").textContent = who;
  $("term_meta").textContent = meta || "";
  $("term_tab").href = termUrl(container);
  $("term_frame").src = termUrl(container);
  $("termwrap").hidden = false;
  $("termwrap").dataset.container = container;
}
function closeTerm(){
  $("termwrap").hidden = true;
  $("term_frame").src = "about:blank";   // drop the session
}
$("term_close").addEventListener("click", closeTerm);
$("term_reload").addEventListener("click", function(){
  var c = $("termwrap").dataset.container;
  if (c) $("term_frame").src = termUrl(c);
});
$("termwrap").addEventListener("click", function(e){
  if (e.target === $("termwrap")) closeTerm();
});

// ---------- confirm modal ----------
var pending = null;
$("micon").appendChild(UI.icon("warn"));
function confirmThen(title, bodyTxt, okLabel, fn, extra){
  $("mtitle").textContent = title;
  $("mbody").textContent = bodyTxt;
  $("mok").textContent = okLabel;
  $("mok").disabled = false;
  $("mextra").textContent = "";
  $("modal").classList.toggle("wide", !!extra);
  if (extra) $("mextra").appendChild(extra);
  pending = fn;
  $("scrim").hidden = false;
  $("mok").focus();
}
function closeModal(){ $("scrim").hidden = true; pending = null; $("mextra").textContent = ""; }

// Delete asks the server what it would move - the server decides, not us -
// and makes you type the lab name, which the server checks again.
function confirmDelete(l){
  var name = l.name || l.file;
  fetch("api/delete-plan?lab=" + encodeURIComponent(l.id), {cache:"no-store"})
    .then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if (!res.ok){ alert(res.j.error || "could not plan the delete"); return; }
      var p = res.j, box = el("div");
      box.appendChild(el("label", null, "These move to " + p.trash_dir + ":"));
      var ul = el("ul","plan");
      p.moves.forEach(function(m){
        ul.appendChild(el("li", null, m + (p.mode === "dir" ? "/  (whole directory)" : "")));
      });
      box.appendChild(ul);
      if (p.shared_with.length)
        box.appendChild(el("div","note warn",
          "the directory also holds " + p.shared_with.join(", ")
          + " — only this lab's files are moved, the rest stays"));
      var f = el("div","field");
      var lab = el("label", null, "Type " + name + " to confirm");
      var inp = el("input","mono"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false;
      lab.htmlFor = inp.id = "mconfirm";
      f.appendChild(lab); f.appendChild(inp); box.appendChild(f);

      confirmThen("Delete " + name + "?",
        (p.will_destroy ? "The lab has containers, so it is destroyed first — anything "
          + "configured on the nodes and not saved is lost. " : "")
        + "Its files are " + (p.will_destroy ? "then " : "") + "moved to the trash, not erased; a RESTORE.txt beside "
        + "them has the commands to put them back.",
        "Delete lab", function(){ act(l, "delete", {confirm_name: inp.value}); }, box);
      $("mok").disabled = true;
      inp.addEventListener("input", function(){ $("mok").disabled = inp.value !== name; });
      inp.addEventListener("keydown", function(e){
        if (e.key === "Enter" && inp.value === name) $("mok").click();
      });
      inp.focus();
    })
    .catch(function(err){ alert("request failed: " + err); });
}
$("mcancel").addEventListener("click", closeModal);
$("scrim").addEventListener("click", function(e){ if (e.target === $("scrim")) closeModal(); });
$("mok").addEventListener("click", function(){ var f = pending; closeModal(); if (f) f(); });
document.addEventListener("keydown", function(e){
  if (e.key !== "Escape") return;
  if (!$("termwrap").hidden) closeTerm(); else closeModal();
});

// ---------- save current config ----------
function whenShort(t){
  var d = new Date(t*1000), now = new Date();
  return d.toDateString() === now.toDateString() ? d.toLocaleTimeString().replace(/:\d\d$/, "") : d.toLocaleDateString();
}
function savedTitle(sv){
  return "Config saved " + new Date(sv.at*1000).toLocaleString() + (sv.by ? " by " + sv.by : "")
    + "\nsaved: " + ((sv.ok||[]).join(", ") || "-")
    + ((sv.failed||[]).length ? "\nnot saved: " + sv.failed.join(", ") : "");
}
function saveFirstBox(){
  var wrap = el("label","ucheck"), box = el("input"); box.type = "checkbox"; box.checked = true;
  wrap.appendChild(box);
  wrap.appendChild(document.createTextNode("Save the current config first, so the next start boots from it"));
  return {wrap: wrap, box: box};
}
// the map keeps its layout per browser; send it so it goes into the topology
function savedLayout(l){
  try { return JSON.parse(localStorage.getItem("clabd-pos2-" + l.id) || "null"); } catch(e){ return null; }
}
function saveLab(l, thenStop){ act(l, thenStop ? "save-destroy" : "save", {layout: savedLayout(l)}); }

// ---------- actions ----------
function act(lab, action, extra){
  var body = {lab_id: lab.id, action: action};
  if (extra) Object.keys(extra).forEach(function(k){ body[k] = extra[k]; });
  fetch("api/action", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify(body)
  }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if (!res.ok){ alert(res.j.error || "action failed"); return; }
      job = res.j.job_id; jobLines = 0; follow = true;
      $("clog").textContent = "";
      $("console").hidden = false;
      $("cspin").style.display = "";
      $("ctitle").textContent = action + " · " + (lab.name || lab.file);
      pollJob();
      schedule(POLL_BUSY);
    })
    .catch(function(err){ alert("request failed: " + err); });
}

$("cclose").addEventListener("click", function(){ $("console").hidden = true; });
$("cfollow").addEventListener("click", function(){
  follow = !follow;
  $("cfollow").setAttribute("aria-pressed", follow ? "true" : "false");
  if (follow) $("clog").scrollTop = $("clog").scrollHeight;
});

function pollJob(){
  if (!job) return;
  fetch("api/job/" + job + "?since=" + jobLines)
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (j.error) return;
      $("ccmd").textContent = j.cmd || "";
      var log = $("clog");
      (j.lines || []).forEach(function(line){
        var cls = line.indexOf("$ ") === 0 ? "cmdline"
                : /exited with code 0/.test(line) ? "done"
                : /(error|ERRO|failed|FATA)/.test(line) ? "err" : null;
        var d = el("div", cls, line);
        log.appendChild(d);
      });
      jobLines = j.total_lines;
      if (follow) log.scrollTop = log.scrollHeight;
      if (!j.running){
        $("cspin").style.display = "none";
        $("ctitle").textContent = j.action + " · " + j.lab_name
          + (j.rc === 0 ? " — done" : " — failed (rc " + j.rc + ")");
        UI.toast(j.action + " " + j.lab_name + (j.rc === 0 ? " finished" : " failed (rc " + j.rc + ")"), j.rc === 0 ? "ok" : "crit");
        job = null;
        schedule(POLL_IDLE);
      } else {
        setTimeout(pollJob, 900);
      }
    })
    .catch(function(){ setTimeout(pollJob, 2000); });
}

// ---------- polling ----------
var lastSig = "";
function tick(){
  fetch("api/state", {cache:"no-store"})
    .then(function(r){ return r.json(); })
    .then(function(s){
      failures = 0;
      liveDot.className = "led ok pulse"; liveBox.classList.remove("stale");
      liveTxt.textContent = s.busy ? "live · job running" : "live";
      state = s;
      var h = s.host || {};
      memHist.push(h.mem_pct || 0); cpuHist.push(h.cpu_pct || 0); histT.push(Date.now());
      if (memHist.length > 60){ memHist.shift(); cpuHist.shift(); histT.shift(); }
      renderStats(h, s.labs);
      var sig = labSignature(s);
      if (sig !== lastSig){ renderLabs(s); lastSig = sig; }
      schedule(s.busy ? POLL_BUSY : POLL_IDLE);
    })
    .catch(function(){
      failures++;
      liveDot.className = "led crit"; liveBox.classList.add("stale");
      liveTxt.textContent = "disconnected";
      schedule(Math.min(15000, 2000 * failures));
    });
}
function schedule(ms){ clearTimeout(timer); timer = setTimeout(tick, ms); }

$("filterseg").appendChild(UI.seg([["all","All"],["running","Running"],["stopped","Stopped"]], filter,
  function(v){ filter = v; if (state) redraw(); }));
$("q").addEventListener("input", function(){
  query = $("q").value; if (state) redraw();
});
$("q").addEventListener("keydown", function(e){ if (e.key === "Escape" && $("q").value){ e.stopPropagation(); $("q").value = ""; query = ""; if (state) redraw(); } });

document.addEventListener("visibilitychange", function(){
  if (!document.hidden) schedule(0);
});

tick();
})();
</script>
